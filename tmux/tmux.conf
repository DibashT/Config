#Enable colors
set -g default-terminal "tmux-256color"
# set -ag terminal-overrides "xterm-256color:RGB"
set -ga terminal-overrides ",tmux-256color:RGB"
set-option -g focus-events on

# Reduce escape time for better vim experience
set -sg escape-time 1

#Change refix to ctrl + space same as nvim
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded."

set -g display-time 4000      # how long messages like "Config Reloaded." stay visible
set -wg aggressive-resize on  # resize window to smallest *active* client, not smallest connected

#Vim-style splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Vim-style splits
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#Scrollback
set -g history-limit 50000

# Don't exit copy mode after yanking
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status line position
# set-option -g status-position top
# bind '`' display-popup -E -w 80% -h 75% "zsh"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#Make new window after current index
bind c new-window -a -c "#{pane_current_path}" 
bind C new-window -c "#{pane_current_path}" 

#Rename windows to dir instead of process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Vim-style copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind P run "wl-paste -n | tmux load-buffer - && tmux paste-buffer"
set -g allow-passthrough on
set -s set-clipboard on
setw -g mode-style 'fg=#1F1F28,bg=#7E9CD8'

#Windows-swapping
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

#Plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tpm-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

#Auto lave / Restore
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Styling of status line (sessions, windows, panes)
set -g status-position top
set -g status-justify left
set -g status-style 'bg=default'

set -g status-left-style 'fg=#1F1F28,bg=#957FB8,bold'
# set -g status-left ' #S '
set -g status-left '#{?client_prefix,#[bg=#C34043]#[fg=#DCD7BA],#[bg=#957FB8]#[fg=#1F1F28]}#[bold] #S #[bg=default]'
set -g status-left-length 20
# set -g status-right '#{?client_prefix,#[bg=#C34043]#[fg=#DCD7BA] 󰌑 PREFIX ,}' # ← prefix indicator
# set -g status-right '#{?client_prefix,#[fg=#C34043]● ,}'
set -g status-right-length 30    
set -g status-right ''

set -g pane-border-lines single
set -g pane-border-style 'fg=#54546D'
set -g pane-active-border-style 'fg=#957FB8'

setw -g window-status-separator ''

#Active window with inverted Kanagawa colors (box effect)
setw -g window-status-current-format ' #[bg=#957FB8,fg=#1F1F28,bold] #I:#W #F #[bg=default] '
setw -g window-status-current-style 'bg=default'

# Inactive windows (keep as is)
setw -g window-status-format '  #I:#W #F  '
setw -g window-status-style 'bg=default,fg=#C8C093'

# F12-style nested session toggle
bind -T root 'C-`' \
  set prefix None \;\
  set key-table off \;\
  setw -g window-status-style 'fg=#554a62' \;\
  setw -g window-status-current-style 'fg=#554a62' \;\
  set -g status-left-style 'fg=#554a62' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S
  
bind -T off 'C-`' \
  set -u prefix \;\
  set -u key-table \;\
  set -u window-status-style \;\
  setw -g window-status-style 'bg=default,fg=#C8C093' \;\
  setw -g window-status-current-style 'bg=default' \;\
  set -g status-left-style 'fg=#957FB8,bg=#1F1F28,bold' \;\
  refresh-client -S

# Correctly pass modified keys to processes running in tmux
set -g extended-keys on
set -g extended-keys-format csi-u

# LOAD TPM
run '~/.tmux/plugins/tpm/tpm'
